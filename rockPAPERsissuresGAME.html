<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROCKpaperGAME</title>
<style>

  /* Page */

  body {
    margin: 0;
    min-height: 100vh;

    font-family: Arial, sans-serif;

    background: #b4c3e3;
    color: white;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }


  /* Game title */

  h2 {
    margin: 0 0 45px;

    font-size: 36px;
    font-weight: 700;
    letter-spacing: 1px;

    color: #ffffff;
  }


  /* Buttons */

  button {
    width: 150px;
    height: 150px;

    margin: 12px;

    border: 2px solid #374151;
    border-radius: 50%;

    background: #1f2937;
    color: white;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);

    transition: 0.25s;
  }


  /* Different button colors */

  button:nth-of-type(1) {
    border-color: #ef4444;
  }

  button:nth-of-type(2) {
    border-color: #00ccff;
  }

  button:nth-of-type(3) {
    border-color: #22c55e;
  }


  /* Hover */

  button:hover {
    transform: translateY(-8px);

    background: #374151;

    box-shadow: 0 14px 25px rgba(0, 0, 0, 0.35);
  }


  button:nth-of-type(1):hover {
    background: #7f1d1d;
  }

  button:nth-of-type(2):hover {
    background: #1e8baf;
  }

  button:nth-of-type(3):hover {
    background: #166534;
  }


  /* Click effect */

  button:active {
    transform: translateY(-2px);
  }


  /* Small screen */

  @media (max-width: 600px) {

    h2 {
      font-size: 26px;
      margin-bottom: 30px;
    }

    button {
      width: 110px;
      height: 110px;

      margin: 5px;

      font-size: 14px;
    }

  }

</style>
  
</head>

<body>
  <h2>ROCK paper SCISSERS game</h2>

  <button onclick="
     const randomnum = Math.random();
     let comguess='';
     if (randomnum >= 0 &&  randomnum < 1/3){
      comguess= 'rock';
      }else if (randomnum >= 1/3 && randomnum <=2/3){
      comguess= 'paper';
      }else if (randomnum >= 2/3 && randomnum <= 1){
      comguess= 'scissers';
      }
      console.log(comguess);
      let result ='';
      if (comguess === 'rock'){
       result = 'tie';
      }else if (comguess === 'paper'){
       result = 'you lose'
      }else if (comguess === 'scissors'){
       result = 'you win';
      }
      alert(`you picked rock. computer picked ${comguess}.${result}`);
    ">ROCK</button>

       result = 'you win';

       result = 'tie'
      }else if (comguess === 'scissors'){
       result = 'you loss';
      }
      alert(`you picked paper. computer picked ${comguess}.${result}`);
  ">PAPER</button>

  <button onclick="
  const randomnum = Math.random();
     let comguess='';
     if (randomnum >= 0 &&  randomnum < 1/3){
      comguess= 'rock';
      }else if (randomnum >= 1/3 && randomnum <=2/3){

      }

      if (comguess === 'rock'){

       result = 'tie try again';

</body>

</html>
